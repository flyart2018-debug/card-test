<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードテスト</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #eeeeee;
    color: #222;
}

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 24px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.status {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin-bottom: 12px;
}

.box {
    background: white;
    border-radius: 12px;
    padding: 11px 4px;
    text-align: center;
    box-shadow: 0 2px 5px #0002;
}

.number {
    font-size: 19px;
    font-weight: bold;
    margin-top: 4px;
}

.section {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 5px #0002;
}

.title {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}

.slots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.slot {
    min-height: 90px;
    border: 2px dashed #aaa;
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.enemy {
    border-color: #c44;
}

.player {
    border-color: #488;
}

.defense {
    border-color: #888;
    background: #fafafa;
}

.card {
    width: 100%;
    min-height: 100px;
    background: #f8f8f8;
    border: 2px solid #aaa;
    border-radius: 10px;
    padding: 10px;
    text-align: left;
}

button.card {
    cursor: pointer;
}

button.card:active {
    transform: scale(0.97);
}

.card-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

.card-info {
    font-size: 13px;
    line-height: 1.5;
}

.hand {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.action {
    width: 100%;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    padding: 8px;
    font-weight: bold;
}

.message {
    text-align: center;
    font-weight: bold;
    margin-top: 10px;
}

.result {
    display: none;
    text-align: center;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 12px;
    background: white;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 2px 5px #0002;
}

.end-button,
.reset-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    color: white;
    padding: 15px;
    font-size: 17px;
    font-weight: bold;
}

.end-button {
    background: #222;
}

.end-button:disabled {
    background: #999;
}

.reset-button {
    background: #777;
    margin-top: 8px;
}
</style>
</head>

<body>

<header>
カードテスト
</header>

<main>

<div class="result" id="result"></div>

<div class="status">

    <div class="box">
        <div>ターン</div>
        <div class="number" id="turn">1</div>
    </div>

    <div class="box">
        <div>国力</div>
        <div class="number" id="playerPower">3</div>
    </div>

    <div class="box">
        <div>CPU防衛軍</div>
        <div class="number" id="enemyDefenseCount">5</div>
    </div>

    <div class="box">
        <div>CPU拠点</div>
        <div class="number" id="cpuBase">3</div>
    </div>

    <div class="box">
        <div>コスト</div>
        <div class="number" id="cost">3</div>
    </div>

</div>


<!-- CPU防衛軍 -->

<div class="section">

    <div class="title">
        CPU 防衛軍
    </div>

    <div class="slots" id="enemyDefense"></div>

</div>


<!-- CPU前線 -->

<div class="section">

    <div class="title">
        CPU 前線
    </div>

    <div class="slots" id="enemyFront"></div>

</div>


<!-- 自分防衛軍 -->

<div class="section">

    <div class="title">
        あなたの防衛軍
    </div>

    <div class="slots" id="playerDefense"></div>

</div>


<!-- 自分前線 -->

<div class="section">

    <div class="title">
        あなたの前線
    </div>

    <div class="slots" id="front"></div>

</div>


<!-- 手札 -->

<div class="section">

    <div class="title">
        手札
    </div>

    <div class="hand" id="hand"></div>

    <div class="message" id="message">
        戦闘テスト
    </div>

</div>


<button
    class="end-button"
    id="endButton"
    onclick="endTurn()">
    ターン終了
</button>

<button
    class="reset-button"
    onclick="resetGame()">
    ゲームリセット
</button>

</main>


<script>

/* ==================================================
   ゲーム変数
================================================== */

let turn;
let cost;

let playerPower;
let cpuPower;

let playerBase;
let cpuBase;

let playerDefense;
let enemyDefense;

let playerFront;
let enemyFront;

let hand;

let playerDeck;
let cpuDeck;

let playerOriginalDeck;
let cpuOriginalDeck;

let canPlay;
let gameOver;


/* ==================================================
   オリジナルデッキ
================================================== */

function createOriginalDeck() {

    return [

        {
            name: "歩兵",
            type: "unit",
            cost: 2,
            attack: 2000,
            defense: 2500
        },

        {
            name: "歩兵",
            type: "unit",
            cost: 2,
            attack: 2000,
            defense: 2500
        },

        {
            name: "槍兵",
            type: "unit",
            cost: 2,
            attack: 2500,
            defense: 2000
        },

        {
            name: "槍兵",
            type: "unit",
            cost: 2,
            attack: 2500,
            defense: 2000
        },

        {
            name: "弓兵",
            type: "unit",
            cost: 2,
            attack: 1800,
            defense: 1800
        },

        {
            name: "弓兵",
            type: "unit",
            cost: 2,
            attack: 1800,
            defense: 1800
        },

        {
            name: "対空魔導師",
            type: "unit",
            cost: 3,
            attack: 2000,
            defense: 2000
        },

        {
            name: "対空魔導師",
            type: "unit",
            cost: 3,
            attack: 2000,
            defense: 2000
        },

        {
            name: "騎兵",
            type: "unit",
            cost: 3,
            attack: 3000,
            defense: 2000
        },

        {
            name: "騎兵",
            type: "unit",
            cost: 3,
            attack: 3000,
            defense: 2000
        }

    ];
}


/* ==================================================
   デッキからランダムに1枚取り出す
================================================== */

function drawRandomCard(deck) {

    if (deck.length === 0) {
        return null;
    }

    const index =
        Math.floor(
            Math.random() * deck.length
        );

    return deck.splice(index, 1)[0];
}


/* ==================================================
   初期防衛軍5枚をランダム選出
================================================== */

function createStartingDefense(originalDeck) {

    const defense = [];

    for (let i = 0; i < 5; i++) {

        const card =
            drawRandomCard(originalDeck);

        if (card) {
            defense.push(card);
        }
    }

    return defense;
}


/* ==================================================
   ゲーム開始
================================================== */

function resetGame() {

    turn = 1;

    cost = 3;

    playerPower = 3;
    cpuPower = 3;

    playerBase = 3;
    cpuBase = 3;


    /*
       オリジナルデッキを作る
    */

    playerOriginalDeck =
        createOriginalDeck();

    cpuOriginalDeck =
        createOriginalDeck();


    /*
       ★ 最初の防衛軍5枚
       オリジナルデッキからランダム選出
    */

    playerDefense =
        createStartingDefense(
            playerOriginalDeck
        );

    enemyDefense =
        createStartingDefense(
            cpuOriginalDeck
        );


    /*
       残ったカードが
       構築デッキ
    */

    playerDeck =
        playerOriginalDeck;

    cpuDeck =
        cpuOriginalDeck;


    playerFront = [];

    enemyFront = [];

    gameOver = false;

    canPlay = true;


    /*
       テスト用手札
    */

    hand = [

        {
            name: "歩兵",
            type: "unit",
            cost: 2,
            attack: 2000,
            defense: 2500
        },

        {
            name: "槍兵",
            type: "unit",
            cost: 2,
            attack: 2500,
            defense: 2000
        },

        {
            name: "対空魔導師",
            type: "unit",
            cost: 3,
            attack: 2000,
            defense: 2000
        }

    ];


    /*
       CPU前線
    */

    enemyFront.push({

        name: "歩兵",

        type: "unit",

        cost: 2,

        attack: 2000,

        defense: 2500,

        ready: true

    });


    document.getElementById(
        "result"
    ).style.display = "none";


    render();


    showMessage(
        "⚔️ 防衛軍5枚をランダム選出！"
    );
}


/* ==================================================
   カード配置
================================================== */

function playCard(index) {

    if (gameOver) return;

    if (!canPlay) {

        showMessage(
            "⚠️ ターン終了済み"
        );

        return;
    }


    const card = hand[index];

    if (!card) return;


    if (cost < card.cost) {

        showMessage(
            "❌ コスト不足"
        );

        return;
    }


    if (playerFront.length >= 3) {

        showMessage(
            "❌ 前線は3枚まで"
        );

        return;
    }


    cost -= card.cost;


    playerFront.push({

        ...card,

        ready: false

    });


    hand.splice(index, 1);


    showMessage(
        "⚔️ " +
        card.name +
        "が出撃！"
    );


    render();
}


/* ==================================================
   攻撃
================================================== */

function attack(index) {

    if (gameOver) return;


    const attacker =
        playerFront[index];


    if (!attacker) return;


    if (!attacker.ready) {

        showMessage(
            "⏳ 次のターンから攻撃できます"
        );

        return;
    }


    /*
       敵前線がある
    */

    if (enemyFront.length > 0) {

        const defender =
            enemyFront[0];


        showMessage(
            "⚔️ " +
            attacker.name +
            " vs " +
            defender.name
        );


        setTimeout(
            function() {

                battle(index);

            },
            400
        );


        return;
    }


    /*
       敵前線がない
       ↓
       防衛軍
    */

    attackDefense(index);
}


/* ==================================================
   防衛軍への攻撃
================================================== */

function attackDefense(index) {

    const attacker =
        playerFront[index];


    if (!attacker) return;


    /*
       防衛軍が残っている
    */

    if (enemyDefense.length > 0) {


        /*
           国力分だけ破壊
        */

        const destroyed =
            Math.min(
                playerPower,
                enemyDefense.length
            );


        /*
           破壊された防衛軍を
           CPU構築デッキへ戻す
        */

        for (
            let i = 0;
            i < destroyed;
            i++
        ) {

            const destroyedCard =
                enemyDefense.pop();


            cpuDeck.push(
                destroyedCard
            );

        }


        attacker.ready = false;


        showMessage(

            "🛡️ CPU防衛軍を " +
            destroyed +
            " 枚破壊！" +

            "<br>" +

            "構築デッキへ戻った" +

            "<br>" +

            "残り防衛軍：" +
            enemyDefense.length

        );


        render();

        return;
    }


    /*
       防衛軍0
       ↓
       拠点
    */

    damageBase("cpu");

    attacker.ready = false;

    render();
}


/* ==================================================
   前線戦闘
================================================== */

function battle(attackerIndex) {

    const attacker =
        playerFront[attackerIndex];

    const defender =
        enemyFront[0];


    if (!attacker || !defender) {
        return;
    }


    if (
        attacker.attack >
        defender.defense
    ) {

        enemyFront.shift();


        showMessage(
            "💥 " +
            attacker.name +
            "が" +
            defender.name +
            "を破壊！"
        );

    }

    else if (
        attacker.attack <
        defender.defense
    ) {

        playerFront.splice(
            attackerIndex,
            1
        );


        showMessage(
            "💀 " +
            attacker.name +
            "が破壊された！"
        );

    }

    else {

        playerFront.splice(
            attackerIndex,
            1
        );

        enemyFront.shift();


        showMessage(
            "💥 両方のカードが同時破壊！"
        );
    }


    render();
}


/* ==================================================
   拠点ダメージ
================================================== */

function damageBase(target) {

    if (target === "cpu") {

        cpuBase--;


        showMessage(
            "🏰 CPU拠点を1つ破壊！" +
            " 残り：" +
            cpuBase
        );


        if (cpuBase <= 0) {

            endGame("win");
        }
    }


    if (target === "player") {

        playerBase--;


        showMessage(
            "🏰 あなたの拠点を1つ破壊！" +
            " 残り：" +
            playerBase
        );


        if (playerBase <= 0) {

            endGame("lose");
        }
    }
}


/* ==================================================
   ターン終了
================================================== */

function endTurn() {

    if (gameOver) return;


    canPlay = false;


    showMessage(
        "ターン終了……"
    );


    setTimeout(
        nextTurn,
        600
    );
}


/* ==================================================
   次ターン
================================================== */

function nextTurn() {

    if (gameOver) return;


    turn++;

    cost += 3;


    playerFront.forEach(
        function(card) {

            card.ready = true;

        }
    );


    /*
       構築デッキから1枚ドロー
    */

    if (playerDeck.length > 0) {

        hand.push(
            playerDeck.shift()
        );
    }


    /*
       防衛軍には触らない
    */

    canPlay = true;


    showMessage(
        "📥 ターン " +
        turn +
        " 開始！"
    );


    render();
}


/* ==================================================
   ゲーム終了
================================================== */

function endGame(result) {

    gameOver = true;

    canPlay = false;


    const resultElement =
        document.getElementById(
            "result"
        );


    resultElement.style.display =
        "block";


    if (result === "win") {

        resultElement.textContent =
            "🎉 勝利！";


        showMessage(
            "CPUの拠点をすべて破壊しました！"
        );
    }


    if (result === "lose") {

        resultElement.textContent =
            "💀 敗北";


        showMessage(
            "あなたの拠点がすべて破壊されました。"
        );
    }


    document.getElementById(
        "endButton"
    ).disabled = true;
}


/* ==================================================
   画面更新
================================================== */

function render() {

    document.getElementById(
        "turn"
    ).textContent = turn;


    document.getElementById(
        "playerPower"
    ).textContent =
        playerPower;


    document.getElementById(
        "enemyDefenseCount"
    ).textContent =
        enemyDefense.length;


    document.getElementById(
        "cpuBase"
    ).textContent =
        cpuBase;


    document.getElementById(
        "cost"
    ).textContent =
        cost;


    /*
       CPU防衛軍
    */

    const enemyDefenseElement =
        document.getElementById(
            "enemyDefense"
        );


    enemyDefenseElement.innerHTML =
        "";


    enemyDefense.forEach(
        function(card, index) {

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "slot defense";


            slot.innerHTML =

                "🛡️<br>" +

                "<strong>" +
                card.name +
                "</strong>";

            enemyDefenseElement.appendChild(
                slot
            );

        }
    );


    if (enemyDefense.length === 0) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "slot defense";


        empty.innerHTML =
            "防衛軍なし<br>" +
            "次の攻撃で拠点へ";


        enemyDefenseElement.appendChild(
            empty
        );
    }


    /*
       自分防衛軍
    */

    const playerDefenseElement =
        document.getElementById(
            "playerDefense"
        );


    playerDefenseElement.innerHTML =
        "";


    playerDefense.forEach(
        function(card) {

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "slot defense";


            slot.innerHTML =

                "🛡️<br>" +

                "<strong>" +
                card.name +
                "</strong>";

            playerDefenseElement.appendChild(
                slot
            );

        }
    );


    /*
       CPU前線
    */

    const enemy =
        document.getElementById(
            "enemyFront"
        );


    enemy.innerHTML =
        "";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot enemy";


        if (enemyFront[i]) {

            const card =
                enemyFront[i];


            slot.innerHTML =

                "<strong>" +
                card.name +
                "</strong><br><br>" +

                "ATK " +
                card.attack +

                "<br>" +

                "DEF " +
                card.defense;

        }

        else {

            slot.textContent =
                "空き";
        }


        enemy.appendChild(slot);
    }


    /*
       自分前線
    */

    const front =
        document.getElementById(
            "front"
        );


    front.innerHTML =
        "";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot player";


        if (playerFront[i]) {

            const card =
                playerFront[i];


            slot.innerHTML =

                "<strong>" +
                card.name +
                "</strong><br><br>" +

                "ATK " +
                card.attack +

                "<br>" +

                "DEF " +
                card.defense;


            if (
                card.ready &&
                !gameOver
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "action";


                button.textContent =
                    "⚔️ 攻撃";


                button.onclick =
                    function() {

                        attack(i);

                    };


                slot.appendChild(
                    button
                );

            }

            else if (!card.ready) {

                const text =
                    document.createElement(
                        "div"
                    );


                text.textContent =
                    "⏳ 待機";


                slot.appendChild(
                    text
                );
            }

        }

        else {

            slot.textContent =
                "空き";
        }


        front.appendChild(slot);
    }


    /*
       手札
    */

    const handElement =
        document.getElementById(
            "hand"
        );


    handElement.innerHTML =
        "";


    hand.forEach(
        function(card, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "card";


            button.innerHTML =

                "<div class='card-name'>" +

                card.name +

                "</div>" +

                "<div class='card-info'>" +

                "コスト：" +
                card.cost +

                "<br>" +

                "ATK：" +
                card.attack +

                "<br>" +

                "DEF：" +
                card.defense +

                "</div>";


            button.onclick =
                function() {

                    playCard(index);

                };


            handElement.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "endButton"
    ).disabled =
        gameOver;
}


/* ==================================================
   メッセージ
================================================== */

function showMessage(text) {

    document.getElementById(
        "message"
    ).innerHTML =
        text;
}


/* ==================================================
   起動
================================================== */

resetGame();

</script>

</body>
</html>
