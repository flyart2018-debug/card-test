<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戦争戦略カードゲーム</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#10131a;
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:#171b24;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

main{
  max-width:1100px;
  margin:auto;
  padding:12px;
}

.status{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:#202632;
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:20px;
  margin-top:4px;
}

.panel{
  background:#1b2029;
  border:1px solid #394252;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

.panel h2,
.panel h3{
  margin-top:0;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.grid1{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.slot{
  min-height:95px;
  border:2px dashed #555f70;
  border-radius:9px;
  padding:8px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.defense-slot{
  background:#0c0f14;
}

.face-down{
  font-size:32px;
  color:#fff;
  background:#090b10;
}

.card{
  background:#242b37;
  border:1px solid #465163;
  border-radius:9px;
  padding:10px;
  margin-bottom:8px;
}

.card-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:5px;
}

.card-info{
  font-size:12px;
  line-height:1.5;
  color:#c3cad5;
}

button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:10px;
  margin-top:6px;
  background:#303a4b;
  color:white;
  font-weight:bold;
}

button:disabled{
  opacity:.45;
}

.log{
  max-height:220px;
  overflow:auto;
  font-size:12px;
  line-height:1.6;
  color:#c5ccd7;
}

.message{
  text-align:center;
  font-weight:bold;
  padding:8px;
  line-height:1.5;
}

.result{
  display:none;
  background:#252d39;
  border-radius:12px;
  padding:18px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin-bottom:12px;
}

@media(max-width:760px){
  .status{
    grid-template-columns:repeat(3,1fr);
  }

  .grid3{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

戦争戦略カードゲーム
</header>

</div>


<!-- ログ -->

<div class="panel">

  <h3>ゲームログ</h3>

</div>

</main>

const game = {

/* =========================================================
   ユーティリティ
========================================================= */

function cloneCard(card){

  return JSON.parse(
    JSON.stringify(card)
  );

}


function shuffle(deck){

  for(
    let i=deck.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      deck[i],
      deck[j]
    ]=[
      deck[j],
      deck[i]
    ];

  }

}


function draw(deck){

  if(!deck.length){

    return null;

  }

  return deck.shift();

}


function createCopies(list,count){

  const result=[];

  list.forEach(card=>{

    for(
      let i=0;
      i<count;
      i++
    ){

      result.push(
        cloneCard(card)
      );

    }

  });

  return shuffle(result);

}


/* =========================================================
   ログ
========================================================= */

function addLog(text){

  game.log.push(

    "T" +
    game.turn +
    "｜" +
    text

  );

  if(game.log.length>80){

    game.log.shift();

  }

}


/* =========================================================
   ゲーム開始
========================================================= */

function resetGame(){

  game.turn=0;

  game.phase="start";

  game.cost=0;

  game.power=0;

  game.bases=3;

  game.gameOver=false;

  game.nextDiscount=0;

  game.hand=[];

  game.buildDeck=[];

  game.playerFront=[];

  game.enemyFront=[];

  game.playerRear=[];

  game.enemyRear=[];

  game.playerAir=[];

  game.enemyAir=[];

  game.playerSeaMain=[];

  game.enemySeaMain=[];

  game.playerSeaEscort=[];

  game.enemySeaEscort=[];

  game.playerHeroes=[];

  game.playerDiplomats=[];

  game.permanentlyRemoved=[];

  game.log=[];


  /*
    基本カード15枚
  */

  game.basicDeck=
    createCopies(
      BASIC_CARDS,
      3
    );


  /*
    基本外交15枚
  */

  game.diplomacyDeck=
    createCopies(
      BASIC_DIPLOMACY,
      3
    );


  /*
    オリジナル30枚
  */

  game.originalDeck=
    ORIGINAL_CARDS.map(
      cloneCard
    );


  shuffle(
    game.originalDeck
  );


  /*
    ★ 重要
    オリジナルデッキから
    防衛軍5枚をランダム選出
  */

  game.playerDefense=[];

  for(
    let i=0;
    i<RULES.DEFENSE_MAX;
    i++
  ){

    const card=
      draw(
        game.originalDeck
      );

    if(card){

      game.playerDefense.push({

        card:card,

        revealed:false

      });

    }

  }


  /*
    CPU側もテスト用に
    オリジナルデッキから5枚
  */

  const cpuOriginal=
    ORIGINAL_CARDS.map(
      cloneCard
    );

  shuffle(cpuOriginal);

  game.enemyDefense=[];

  for(
    let i=0;
    i<RULES.DEFENSE_MAX;
    i++
  ){

    const card=
      cpuOriginal.shift();

    if(card){

      game.enemyDefense.push({

        card:card,

        revealed:false

      });

    }

  }


  /*
    CPU前線のテストカード
  */

  game.enemyFront.push({

    name:"歩兵",

    type:"land",

    cost:2,

    power:0,

    atk:2000,

    def:2500,

    ready:true

  });


  addLog(
    "ゲーム開始：防衛軍5枚を裏向きで配置"
  );


  render();

}


/* =========================================================
   ターン開始
========================================================= */

function beginTurn(){

  if(game.gameOver){

    return;

  }


  game.turn++;

  game.phase="main";


  /*
    毎ターンコスト3追加
  */

  game.cost+=
    RULES.COST_PER_TURN;


  /*
    基本カードまたは外交カードを1枚
  */

  let firstCard;

  if(game.turn%2===1){

    firstCard=
      draw(
        game.basicDeck
      );

  }
  else{

    firstCard=
      draw(
        game.diplomacyDeck
      );

  }


  if(firstCard){

    game.hand.push(
      firstCard
    );

  }


  /*
    オリジナル/構築から1枚
  */

  let secondCard;

  if(
    game.buildDeck.length>0
  ){

    secondCard=
      draw(
        game.buildDeck
      );

  }
  else{

    secondCard=
      draw(
        game.originalDeck
      );

  }


  if(secondCard){

    game.hand.push(
      secondCard
    );

  }


  /*
    前ターン以前に出た
    カードを攻撃可能へ
  */

  game.playerFront.forEach(
    card=>{

      if(!card.rush){

        card.ready=true;

      }

    }
  );


  game.playerAir.forEach(
    card=>{

      card.ready=true;

    }
  );


  game.playerSeaMain.forEach(
    card=>{

      card.ready=true;

    }
  );


  game.playerSeaEscort.forEach(
    card=>{

      card.ready=true;

    }
  );


  addLog(
    "開始フェイズ：コスト＋3、カード2枚ドロー"
  );


  render();

}


/* =========================================================
   国力
========================================================= */

function increasePower(){

  if(game.gameOver){

    return;

  }


  if(
    game.power>=
    RULES.POWER_MAX
  ){

    addLog(
      "国力は上限10"
    );

    render();

    return;

  }


  if(
    game.cost<
    RULES.POWER_UP_COST
  ){

    addLog(
      "国力上昇にはコスト5が必要"
    );

    render();

    return;

  }


  game.cost-=
    RULES.POWER_UP_COST;


  game.power++;


  addLog(
    "国力＋1 → "+game.power
  );


  render();

}


/* =========================================================
   カード使用条件
========================================================= */

function canUseCard(card){

  let requiredCost=
    card.cost;


  if(
    game.nextDiscount>0
  ){

    requiredCost=
      Math.max(
        0,
        requiredCost-
        game.nextDiscount
      );

  }


  if(
    game.cost<
    requiredCost
  ){

    addLog(
      "コスト不足："+card.name
    );

    return false;

  }


  if(
    game.power<
    card.power
  ){

    addLog(
      "国力不足："+card.name
    );

    return false;

  }


  return true;

}


/* =========================================================
   手札から前線・空軍・海軍・外交官
========================================================= */

function playCard(index){

  if(game.gameOver){

    return;

  }


  const card=
    game.hand[index];


  if(!card){

    return;

  }


  if(!canUseCard(card)){

    render();

    return;

  }


  let actualCost=
    card.cost;


  if(
    game.nextDiscount>0
  ){

    actualCost=
      Math.max(
        0,
        actualCost-
        game.nextDiscount
      );

    game.nextDiscount=0;

  }


  /*
    陸上
  */

  if(
    card.type==="land"
  ){

    if(
      game.playerFront.length>=
      RULES.FRONT_MAX
    ){

      addLog(
        "前線は3枚まで"
      );

      render();

      return;

    }


    game.cost-=actualCost;

    game.hand.splice(
      index,
      1
    );


    game.playerFront.push({

      ...card,

      ready:
        card.rush===true

    });


    addLog(
      "前線配置："+card.name
    );


    render();

    return;

  }


  /*
    空軍
  */

  if(
    card.type==="air"
  ){

    if(
      game.playerAir.length>=
      RULES.AIR_MAX
    ){

      addLog(
        "空軍は1枚まで"
      );

      render();

      return;

    }


    game.cost-=actualCost;

    game.hand.splice(
      index,
      1
    );


    game.playerAir.push({

      ...card,

      ready:true

    });


    addLog(
      "空軍配置："+card.name
    );


    render();

    return;

  }


  /*
    海軍主力
  */

  if(
    card.type==="seaMain"
  ){

    if(
      game.playerSeaMain.length>=
      RULES.SEA_MAIN_MAX
    ){

      addLog(
        "海軍主力は1枚まで"
      );

      render();

      return;

    }


    game.cost-=actualCost;

    game.hand.splice(
      index,
      1
    );


    game.playerSeaMain.push({

      ...card,

      ready:true

    });


    addLog(
      "海軍主力配置："+card.name
    );


    render();

    return;

  }


  /*
    海軍護衛
  */

  if(
    card.type==="seaEscort"
  ){

    if(
      game.playerSeaEscort.length>=
      RULES.SEA_ESCORT_MAX
    ){

      addLog(
        "海軍護衛は1枚まで"
      );

      render();

      return;

    }


    game.cost-=actualCost;

    game.hand.splice(
      index,
      1
    );


    game.playerSeaEscort.push({

      ...card,

      ready:true

    });


    addLog(
      "海軍護衛配置："+card.name
    );


    render();

    return;

  }


  /*
    外交官
  */

  if(
    card.type==="diplomat"
  ){

    game.cost-=actualCost;

    game.hand.splice(
      index,
      1
    );


    game.playerDiplomats.push(
      card
    );


    addLog(
      "外交官配置："+card.name
    );


    render();

    return;

  }


  /*
    戦術カード
  */

  if(
    card.type==="tactic"
  ){

    game.cost-=actualCost;

    game.hand.splice(
      index,
      1
    );


    resolveTactic(
      card
    );


    render();

  }

}


/* =========================================================
   手札 → 防衛軍
   ★ 完全0コスト
========================================================= */

function placeDefenseFromHand(index){

  if(game.gameOver){

    return;

  }


  if(
    game.playerDefense.length>=
    RULES.DEFENSE_MAX
  ){

    addLog(
      "防衛軍は最大5枚"
    );

    render();

    return;

  }


  const card=
    game.hand[index];


  if(!card){

    return;

  }


  /*
    ★ 防衛軍配置にはコスト不要
    ★ 国力も消費しない
  */

  game.playerDefense.push({

    card:card,

    revealed:false

  });


  game.hand.splice(
    index,
    1
  );


  addLog(
    "手札から防衛軍へ配置："+card.name+
    "（0コスト）"
  );


  render();

}


/* =========================================================
   戦術カード
========================================================= */

function resolveTactic(card){

  switch(
    card.name
  ){

    case "戦線援護":

      if(
        game.playerFront[0]
      ){

        game.playerFront[0].atk+=
          1000;

      }

      break;


    case "緊急防衛令":

      if(
        game.playerFront[0]
      ){

        game.playerFront[0].def+=
          1500;

      }

      break;


    case "緊急徴兵":

    case "緊急動員":{

      const basic=
        draw(
          game.basicDeck
        );

      if(basic){

        game.hand.push(
          basic
        );

      }

      break;

    }


    case "国力支援":

      game.nextDiscount=1;

      break;


    case "戦術撤退":

      if(
        game.playerFront.length>0 &&
        game.playerRear.length<
        RULES.REAR_MAX
      ){

        game.playerRear.push(
          game.playerFront.shift()
        );

      }

      break;


    case "奇襲作戦":

      if(
        game.playerFront[0]
      ){

        game.playerFront[0].ready=true;

      }

      break;


    case "戦線突破":

      if(
        game.playerFront[0]
      ){

        game.playerFront[0].atk+=
          2000;

      }

      break;


    case "空爆要請":

      if(
        game.playerAir[0]
      ){

        game.playerAir[0].atk+=
          2000;

      }

      break;


    case "緊急修理":{

      const ship=
        game.playerSeaMain[0] ||
        game.playerSeaEscort[0];

      if(ship){

        ship.def+=
          2000;

      }

      break;

    }


    case "強制徴兵":{

      const card=
        game.buildDeck.length>0
          ? draw(game.buildDeck)
          : draw(game.originalDeck);

      if(card){

        game.hand.push(
          card
        );

      }

      break;

    }


    case "国力徴収":

      addLog(
        "相手の国力破壊：相手側処理へ"
      );

      break;


    case "偽情報":

      addLog(
        "相手防衛軍2枚確認・順番変更"
      );

      break;


    case "永久追放":

      addLog(
        "永久追放：対象選択待ち"
      );

      break;

  }

}


/* =========================================================
   防衛軍への攻撃
========================================================= */

function attackEnemyDefense(){

  if(game.gameOver){

    return;

  }


  /*
    防衛軍への攻撃条件
    前線0枚
  */

  if(
    game.enemyFront.length>0
  ){

    addLog(
      "敵前線が残っているため防衛軍を攻撃できない"
    );

    render();

    return;

  }


  /*
    防衛軍0枚
    → 拠点へ
  */

  if(
    game.enemyDefense.length===0
  ){

    damageEnemyBase();

    return;

  }


  /*
    通常攻撃の破壊枚数
    ＝攻撃側国力
  */

  let destroyCount=
    Math.min(
      game.power,
      game.enemyDefense.length
    );


  /*
    破城兵
    前線0枚時、防衛軍攻撃＋1
  */

  const hasSiege=
    game.playerFront.some(
      card=>
        card.name==="破城兵"
    );


  if(hasSiege){

    destroyCount=
      Math.min(
        destroyCount+1,
        game.enemyDefense.length
      );

  }


  /*
    公開 → 破壊
  */

  for(
    let i=0;
    i<destroyCount;
    i++
  ){

    const target=
      game.enemyDefense.pop();


    /*
      ここで初めて公開
    */

    target.revealed=true;


    addLog(
      "防衛軍公開："+target.card.name
    );


    /*
      通常破壊なので
      構築デッキへ戻す
    */

    returnToBuildDeck(
      target.card
    );

  }


  addLog(
    "防衛軍破壊："+destroyCount+"枚"
  );


  render();

}


/* =========================================================
   破壊カード処理
========================================================= */

function returnToBuildDeck(card){

  game.buildDeck.push(
    card
  );


  shuffle(
    game.buildDeck
  );

}


/*
  永久追放。
  これは構築デッキへ戻さない。
*/

function permanentlyRemove(card){

  game.permanentlyRemoved.push(
    card
  );

}


/* =========================================================
   拠点破壊
========================================================= */

function damageEnemyBase(){

  if(game.gameOver){

    return;

  }


  game.bases--;


  if(
    game.bases<=0
  ){

    game.gameOver=true;


    document.getElementById(
      "result"
    ).style.display="block";


    document.getElementById(
      "result"
    ).textContent="🎉 勝利！";


    addLog(
      "相手の拠点をすべて破壊"
    );


    render();

    return;

  }


  /*
    次の拠点は防衛軍0枚
    ※自動補充しない
  */

  game.enemyDefense=[];


  addLog(
    "拠点破壊！残り拠点："+game.bases+
    "。次の拠点は防衛軍0枚"
  );


  render();

}


/* =========================================================
   前線戦闘
========================================================= */

function attackEnemyFront(
  attackerIndex,
  defenderIndex
){

  if(game.gameOver){

    return;

  }


  const attacker=
    game.playerFront[
      attackerIndex
    ];


  const defender=
    game.enemyFront[
      defenderIndex
    ];


  if(
    !attacker ||
    !defender
  ){

    return;

  }


  if(
    !attacker.ready
  ){

    addLog(
      "このカードはまだ攻撃できない"
    );

    render();

    return;

  }


  /*
    ATK > DEF
  */

  if(
    attacker.atk>
    defender.def
  ){

    returnToBuildDeck(
      defender
    );


    game.enemyFront.splice(
      defenderIndex,
      1
    );


    attacker.ready=false;


    addLog(
      attacker.name+
      "が"+
      defender.name+
      "を破壊"
    );

  }


  /*
    ATK < DEF
  */

  else if(
    attacker.atk<
    defender.def
  ){

    returnToBuildDeck(
      attacker
    );


    game.playerFront.splice(
      attackerIndex,
      1
    );


    addLog(
      attacker.name+
      "が破壊された"
    );

  }


  /*
    ATK = DEF
  */

  else{

    returnToBuildDeck(
      attacker
    );

    returnToBuildDeck(
      defender
    );


    game.playerFront.splice(
      attackerIndex,
      1
    );

    game.enemyFront.splice(
      defenderIndex,
      1
    );


    addLog(
      "同時破壊"
    );

  }


  render();

}


/* =========================================================
   ターン終了
========================================================= */

function finishTurn(){

  if(game.gameOver){

    return;

  }


  game.phase="end";


  game.playerFront.forEach(
    card=>{

      if(!card.rush){

        card.ready=false;

      }

    }
  );


  addLog(
    "ターン終了"
  );


  render();

}


/* =========================================================
   表示
========================================================= */

function renderDefense(
  elementId,
  defense
){

  const element=
    document.getElementById(
      elementId
    );


  element.innerHTML="";


  if(
    defense.length===0
  ){

    element.innerHTML=
      '<div class="slot defense-slot">'+
      '防衛軍なし'+
      '</div>';

    return;

  }


  defense.forEach(
    (entry,index)=>{

      const slot=
        document.createElement(
          "div"
        );


      slot.className=
        "slot defense-slot";


      /*
        裏向き
      */

      if(
        !entry.revealed
      ){

        slot.classList.add(
          "face-down"
        );


        slot.textContent="🂠";

      }


      /*
        公開済み
      */

      else{

        slot.innerHTML=

          "<strong>"+
          entry.card.name+
          "</strong><br>"+
          "ATK "+
          entry.card.atk+
          "<br>"+
          "DEF "+
          entry.card.def;

      }


      element.appendChild(
        slot
      );

    }
  );

}


function renderZone(
  elementId,
  cards
){

  const element=
    document.getElementById(
      elementId
    );


  element.innerHTML="";


  if(
    cards.length===0
  ){

    element.innerHTML=
      '<div class="slot">空き</div>';

    return;

  }


  cards.forEach(
    card=>{

      const slot=
        document.createElement(
          "div"
        );


      slot.className=
        "slot";


      slot.innerHTML=

        "<strong>"+
        card.name+
        "</strong><br>"+
        "ATK "+
        (card.atk||"-")+
        "<br>"+
        "DEF "+
        (card.def||"-");


      element.appendChild(
        slot
      );

    }
  );

}


/* =========================================================
   手札表示
========================================================= */

function renderHand(){

  const element=
    document.getElementById(
      "hand"
    );


  element.innerHTML="";


  if(
    game.hand.length===0
  ){

    element.innerHTML=
      '<div class="card">手札なし</div>';

    return;

  }


  game.hand.forEach(
    (card,index)=>{

      const box=
        document.createElement(
          "div"
        );


      box.className="card";


      box.innerHTML=

        "<div class='card-name'>"+
        card.name+
        "</div>"+

        "<div class='card-info'>"+
        "種類："+card.type+
        "<br>"+
        "コスト："+(card.cost||0)+
        "<br>"+
        "国力："+(card.power||0)+
        "<br>"+
        "ATK："+(card.atk||"-")+
        "<br>"+
        "DEF："+(card.def||"-")+
        "<br>"+
        card.effect+
        "</div>";


      /*
        通常使用
      */

      const useButton=
        document.createElement(
          "button"
        );


      useButton.textContent=
        "使用・配置";


      useButton.onclick=
        function(){

          playCard(index);

        };


      box.appendChild(
        useButton
      );


      /*
        防衛軍配置
        ★ 0コスト
      */

      const defenseButton=
        document.createElement(
          "button"
        );


      defenseButton.textContent=
        "🂠 防衛軍に置く（0コスト）";


      if(
        game.playerDefense.length>=
        RULES.DEFENSE_MAX
      ){

        defenseButton.disabled=true;

      }
      else{

        defenseButton.onclick=
          function(){

            placeDefenseFromHand(
              index
            );

          };

      }


      box.appendChild(
        defenseButton
      );


      element.appendChild(
        box
      );

    }
  );

}


/* =========================================================
   全体レンダー
========================================================= */

function render(){

  document.getElementById(
    "turn"
  ).textContent=
    game.turn;


  document.getElementById(
    "power"
  ).textContent=
    game.power;


  document.getElementById(
    "cost"
  ).textContent=
    game.cost;


  document.getElementById(
    "bases"
  ).textContent=
    game.bases;


  document.getElementById(
    "defenseCount"
  ).textContent=
    game.enemyDefense.length;


  document.getElementById(
    "handCount"
  ).textContent=
    game.hand.length;


  renderDefense(
    "playerDefense",
    game.playerDefense
  );


  renderDefense(
    "enemyDefense",
    game.enemyDefense
  );


  renderZone(
    "playerFront",
    game.playerFront
  );


  renderZone(
    "enemyFront",
    game.enemyFront
  );


  renderZone(
    "playerRear",
    game.playerRear
  );


  renderZone(
    "enemyRear",
    game.enemyRear
  );


  renderZone(
    "playerAir",
    game.playerAir
  );


  renderZone(
    "enemyAir",
    game.enemyAir
  );


  renderZone(
    "playerSea",
    [
      ...game.playerSeaMain,
      ...game.playerSeaEscort
    ]
  );


  renderZone(
    "enemySea",
    [
      ...game.enemySeaMain,
      ...game.enemySeaEscort
    ]
  );


  renderZone(
    "playerHeroes",
    game.playerHeroes
  );


  renderZone(
    "playerDiplomats",
    game.playerDiplomats
  );


  renderHand();


  document.getElementById(
    "log"
  ).innerHTML=
    game.log
      .slice()
      .reverse()
      .map(
        text=>
          "<div>"+
          text+
          "</div>"
      )
      .join("");


  document.getElementById(
    "message"
  ).textContent=
    game.gameOver
      ? "ゲーム終了"
      : "現在のフェイズ："+game.phase;

}


/* =========================================================
   起動
========================================================= */

resetGame();

</script>
