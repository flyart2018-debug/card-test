<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードテスト</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #eeeeee;
    color: #222;
}

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 24px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.status {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.box {
    background: white;
    border-radius: 12px;
    padding: 12px 5px;
    text-align: center;
    box-shadow: 0 2px 5px #0002;
}

.number {
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
}

.section {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 5px #0002;
}

.title {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}

.slots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.slot {
    min-height: 100px;
    border: 2px dashed #aaa;
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.enemy {
    border-color: #c44;
}

.player {
    border-color: #488;
}

.defense {
    border-color: #888;
    background: #fafafa;
}

.card {
    width: 100%;
    min-height: 100px;
    background: #f8f8f8;
    border: 2px solid #aaa;
    border-radius: 10px;
    padding: 10px;
    text-align: left;
}

button.card {
    cursor: pointer;
}

button.card:active {
    transform: scale(0.97);
}

.card-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

.card-info {
    font-size: 13px;
    line-height: 1.5;
}

.hand {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.action {
    width: 100%;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    padding: 8px;
    font-weight: bold;
}

.message {
    text-align: center;
    font-weight: bold;
    margin-top: 10px;
}

.result {
    display: none;
    text-align: center;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 12px;
    background: white;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 2px 5px #0002;
}

.end-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
}

.end-button:disabled {
    background: #999;
}

.reset-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: #777;
    color: white;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 8px;
}
</style>
</head>

<body>

<header>
カードテスト
</header>

<main>

<!-- 勝敗表示 -->

<div
    class="result"
    id="result"
></div>


<!-- ステータス -->

<div class="status">

    <div class="box">
        <div>ターン</div>
        <div
            class="number"
            id="turn"
        >
            1
        </div>
    </div>

    <div class="box">
        <div>あなた拠点</div>
        <div
            class="number"
            id="playerBase"
        >
            3
        </div>
    </div>

    <div class="box">
        <div>CPU拠点</div>
        <div
            class="number"
            id="cpuBase"
        >
            3
        </div>
    </div>

    <div class="box">
        <div>コスト</div>
        <div
            class="number"
            id="cost"
        >
            3
        </div>
    </div>

</div>


<!-- CPU防衛軍 -->

<div class="section">

    <div class="title">
        CPU 防衛軍
    </div>

    <div
        class="slots"
        id="enemyDefense"
    >
    </div>

</div>


<!-- CPU前線 -->

<div class="section">

    <div class="title">
        CPU 前線
    </div>

    <div
        class="slots"
        id="enemyFront"
    >
    </div>

</div>


<!-- 自分防衛軍 -->

<div class="section">

    <div class="title">
        あなたの防衛軍
    </div>

    <div
        class="slots"
        id="playerDefense"
    >
    </div>

</div>


<!-- 自分前線 -->

<div class="section">

    <div class="title">
        あなたの前線
    </div>

    <div
        class="slots"
        id="front"
    >
    </div>

</div>


<!-- 手札 -->

<div class="section">

    <div class="title">
        手札
    </div>

    <div
        class="hand"
        id="hand"
    >
    </div>

    <div
        class="message"
        id="message"
    >
        戦闘テスト
    </div>

</div>


<button
    class="end-button"
    id="endButton"
    onclick="endTurn()"
>
    ターン終了
</button>


<button
    class="reset-button"
    onclick="resetGame()"
>
    ゲームリセット
</button>

</main>


<script>

let turn;
let cost;

let playerBase;
let cpuBase;

let playerFront;
let enemyFront;

let playerDefense;
let enemyDefense;

let hand;
let deck;

let canPlay;
let gameOver;


/* =========================
   ゲーム開始
========================= */

function resetGame() {

    turn = 1;

    cost = 3;

    playerBase = 3;

    cpuBase = 3;

    playerFront = [];

    enemyFront = [];

    playerDefense = 3;

    enemyDefense = 3;

    gameOver = false;

    canPlay = true;


    deck = [

        {
            name: "歩兵",
            cost: 2,
            attack: 2000,
            defense: 2500
        },

        {
            name: "槍兵",
            cost: 2,
            attack: 2500,
            defense: 2000
        },

        {
            name: "対空魔導師",
            cost: 3,
            attack: 2000,
            defense: 2000
        },

        {
            name: "歩兵",
            cost: 2,
            attack: 2000,
            defense: 2500
        },

        {
            name: "槍兵",
            cost: 2,
            attack: 2500,
            defense: 2000
        }

    ];


    hand = [

        {
            name: "歩兵",
            cost: 2,
            attack: 2000,
            defense: 2500
        },

        {
            name: "槍兵",
            cost: 2,
            attack: 2500,
            defense: 2000
        },

        {
            name: "対空魔導師",
            cost: 3,
            attack: 2000,
            defense: 2000
        }

    ];


    /*
       テスト用CPU歩兵
    */

    enemyFront.push({

        name: "歩兵",
        cost: 2,
        attack: 2000,
        defense: 2500,

        ready: true

    });


    document.getElementById(
        "result"
    ).style.display = "none";


    render();

    showMessage(
        "⚔️ 拠点テスト開始"
    );

}


/* =========================
   カード配置
========================= */

function playCard(index) {

    if (gameOver) return;

    if (!canPlay) {

        showMessage(
            "⚠️ ターン終了済み"
        );

        return;

    }


    const card = hand[index];

    if (!card) return;


    if (cost < card.cost) {

        showMessage(
            "❌ コスト不足"
        );

        return;

    }


    if (playerFront.length >= 3) {

        showMessage(
            "❌ 前線は3枚まで"
        );

        return;

    }


    cost -= card.cost;


    playerFront.push({

        ...card,

        ready: false

    });


    hand.splice(index, 1);


    showMessage(
        "⚔️ " +
        card.name +
        "が出撃！"
    );


    render();

}


/* =========================
   攻撃
========================= */

function attack(index) {

    if (gameOver) return;


    const attacker =
        playerFront[index];


    if (!attacker) return;


    if (!attacker.ready) {

        showMessage(
            "⏳ 次のターンから攻撃できます"
        );

        return;

    }


    /*
       敵前線が存在
    */

    if (enemyFront.length > 0) {

        const defender =
            enemyFront[0];


        showMessage(
            "⚔️ " +
            attacker.name +
            " vs " +
            defender.name
        );


        setTimeout(() => {

            battle(index);

        }, 500);


        return;

    }


    /*
       敵前線がない
       ↓
       防衛軍へ
    */

    attackDefense(index);

}


/* =========================
   防衛軍への攻撃
========================= */

function attackDefense(index) {

    const attacker =
        playerFront[index];


    if (!attacker) return;


    /*
       防衛軍が残っている
    */

    if (enemyDefense > 0) {

        enemyDefense--;


        attacker.ready = false;


        showMessage(
            "🛡️ 防衛軍を1枚破壊！" +
            " 残り：" +
            enemyDefense
        );


        render();

        return;

    }


    /*
       防衛軍0
       ↓
       拠点へ
    */

    damageBase("cpu");


    attacker.ready = false;


    render();

}


/* =========================
   拠点へのダメージ
========================= */

function damageBase(target) {

    if (target === "cpu") {

        if (cpuBase > 0) {

            cpuBase--;

        }


        showMessage(
            "🏰 CPUの拠点を1つ破壊！" +
            " 残り：" +
            cpuBase
        );


        if (cpuBase <= 0) {

            endGame("win");

        }

    }


    if (target === "player") {

        if (playerBase > 0) {

            playerBase--;

        }


        showMessage(
            "🏰 あなたの拠点を1つ破壊！" +
            " 残り：" +
            playerBase
        );


        if (playerBase <= 0) {

            endGame("lose");

        }

    }

}


/* =========================
   戦闘
========================= */

function battle(attackerIndex) {

    const attacker =
        playerFront[attackerIndex];


    const defender =
        enemyFront[0];


    if (!attacker || !defender) {

        return;

    }


    /*
       ATK > DEF
    */

    if (
        attacker.attack >
        defender.defense
    ) {

        enemyFront.shift();


        showMessage(
            "💥 " +
            attacker.name +
            "が" +
            defender.name +
            "を破壊！"
        );

    }


    /*
       ATK < DEF
    */

    else if (
        attacker.attack <
        defender.defense
    ) {

        playerFront.splice(
            attackerIndex,
            1
        );


        showMessage(
            "💀 " +
            attacker.name +
            "が破壊された！"
        );

    }


    /*
       ATK = DEF
    */

    else {

        playerFront.splice(
            attackerIndex,
            1
        );

        enemyFront.shift();


        showMessage(
            "💥 両方のカードが同時破壊！"
        );

    }


    render();

}


/* =========================
   ターン終了
========================= */

function endTurn() {

    if (gameOver) return;


    canPlay = false;


    showMessage(
        "ターン終了……"
    );


    setTimeout(
        nextTurn,
        600
    );

}


/* =========================
   次ターン
========================= */

function nextTurn() {

    if (gameOver) return;


    turn++;

    cost += 3;


    playerFront.forEach(
        card => {
            card.ready = true;
        }
    );


    if (deck.length > 0) {

        hand.push(
            deck.shift()
        );

    }


    canPlay = true;


    showMessage(
        "📥 ターン " +
        turn +
        " 開始！"
    );


    render();

}


/* =========================
   ゲーム終了
========================= */

function endGame(result) {

    gameOver = true;

    canPlay = false;


    const resultElement =
        document.getElementById(
            "result"
        );


    resultElement.style.display =
        "block";


    if (result === "win") {

        resultElement.textContent =
            "🎉 勝利！";

        showMessage(
            "CPUの拠点をすべて破壊しました！"
        );

    }


    if (result === "lose") {

        resultElement.textContent =
            "💀 敗北";

        showMessage(
            "あなたの拠点がすべて破壊されました。"
        );

    }


    document.getElementById(
        "endButton"
    ).disabled = true;

}


/* =========================
   画面更新
========================= */

function render() {

    document.getElementById(
        "turn"
    ).textContent = turn;


    document.getElementById(
        "cost"
    ).textContent = cost;


    document.getElementById(
        "playerBase"
    ).textContent = playerBase;


    document.getElementById(
        "cpuBase"
    ).textContent = cpuBase;


    /*
       CPU防衛軍
    */

    const enemyDefenseElement =
        document.getElementById(
            "enemyDefense"
        );


    enemyDefenseElement.innerHTML = "";


    for (
        let i = 0;
        i < enemyDefense;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot defense";


        slot.innerHTML =
            "🛡️<br>" +
            "<strong>防衛軍</strong>";


        enemyDefenseElement.appendChild(
            slot
        );

    }


    if (enemyDefense === 0) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "slot defense";


        empty.innerHTML =
            "防衛軍なし<br>" +
            "次の攻撃で拠点へ";


        enemyDefenseElement.appendChild(
            empty
        );

    }


    /*
       自分防衛軍
    */

    const playerDefenseElement =
        document.getElementById(
            "playerDefense"
        );


    playerDefenseElement.innerHTML = "";


    for (
        let i = 0;
        i < playerDefense;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot defense";


        slot.innerHTML =
            "🛡️<br>" +
            "<strong>防衛軍</strong>";


        playerDefenseElement.appendChild(
            slot
        );

    }


    /*
       CPU前線
    */

    const enemy =
        document.getElementById(
            "enemyFront"
        );


    enemy.innerHTML = "";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot enemy";


        if (enemyFront[i]) {

            const card =
                enemyFront[i];


            slot.innerHTML =

                "<strong>" +
                card.name +
                "</strong><br><br>" +

                "ATK " +
                card.attack +

                "<br>" +

                "DEF " +
                card.defense;

        }

        else {

            slot.textContent =
                "空き";

        }


        enemy.appendChild(slot);

    }


    /*
       自分前線
    */

    const front =
        document.getElementById(
            "front"
        );


    front.innerHTML = "";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot player";


        if (playerFront[i]) {

            const card =
                playerFront[i];


            slot.innerHTML =

                "<strong>" +
                card.name +
                "</strong><br><br>" +

                "ATK " +
                card.attack +

                "<br>" +

                "DEF " +
                card.defense;


            if (card.ready && !gameOver) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "action";


                button.textContent =
                    "⚔️ 攻撃";


                button.onclick =
                    function () {

                        attack(i);

                    };


                slot.appendChild(
                    button
                );

            }

            else if (!card.ready) {

                const text =
                    document.createElement(
                        "div"
                    );


                text.textContent =
                    "⏳ 待機";


                slot.appendChild(
                    text
                );

            }

        }

        else {

            slot.textContent =
                "空き";

        }


        front.appendChild(slot);

    }


    /*
       手札
    */

    const handElement =
        document.getElementById(
            "hand"
        );


    handElement.innerHTML = "";


    hand.forEach(
        (card, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "card";


            button.innerHTML =

                "<div class='card-name'>" +
                card.name +
                "</div>" +

                "<div class='card-info'>" +

                "コスト：" +
                card.cost +

                "<br>" +

                "国力：0" +

                "<br>" +

                "ATK：" +
                card.attack +

                "<br>" +

                "DEF：" +
                card.defense +

                "</div>";


            button.onclick =
                function () {

                    playCard(index);

                };


            handElement.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "endButton"
    ).disabled = gameOver;

}


/* =========================
   メッセージ
========================= */

function showMessage(text) {

    document.getElementById(
        "message"
    ).textContent = text;

}


/* =========================
   起動
========================= */

resetGame();

</script>

</body>
</html>
