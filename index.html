<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードテスト</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #eeeeee;
    color: #222;
}

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 24px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.status {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.box {
    background: white;
    border-radius: 12px;
    padding: 12px 5px;
    text-align: center;
    box-shadow: 0 2px 5px #0002;
}

.number {
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
}

.section {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 5px #0002;
}

.title {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}

.slots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.slot {
    min-height: 100px;
    border: 2px dashed #aaa;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.card {
    width: 100%;
    min-height: 100px;
    background: #f8f8f8;
    border: 2px solid #aaa;
    border-radius: 10px;
    padding: 10px;
    text-align: left;
}

button.card {
    cursor: pointer;
}

button.card:active {
    transform: scale(0.97);
}

.card-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

.card-info {
    font-size: 13px;
    line-height: 1.5;
}

.hand {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.message {
    text-align: center;
    font-weight: bold;
    margin-top: 10px;
}

.end-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
}

.end-button:disabled {
    background: #999;
}
</style>
</head>

<body>

<header>
カードテスト
</header>

<main>

<div class="status">

    <div class="box">
        <div>ターン</div>
        <div class="number" id="turn">1</div>
    </div>

    <div class="box">
        <div>拠点</div>
        <div class="number">● ● ●</div>
    </div>

    <div class="box">
        <div>国力</div>
        <div class="number">0</div>
    </div>

    <div class="box">
        <div>コスト</div>
        <div class="number" id="cost">3</div>
    </div>

</div>


<div class="section">

    <div class="title">
        前線
    </div>

    <div class="slots" id="front">

        <div class="slot">空き</div>
        <div class="slot">空き</div>
        <div class="slot">空き</div>

    </div>

</div>


<div class="section">

    <div class="title">
        手札
    </div>

    <div class="hand" id="hand">
    </div>

    <div class="message" id="message">
        あなたのターン
    </div>

</div>


<button class="end-button" id="endButton" onclick="endTurn()">
    ターン終了
</button>

</main>


<script>

let turn = 1;

let cost = 3;

let frontCards = [];

let hand = [];

let deck = [
    {
        name: "歩兵",
        cost: 2,
        attack: 2000,
        defense: 2500
    },
    {
        name: "槍兵",
        cost: 2,
        attack: 2500,
        defense: 2000
    },
    {
        name: "対空魔導師",
        cost: 3,
        attack: 2000,
        defense: 2000
    },
    {
        name: "歩兵",
        cost: 2,
        attack: 2000,
        defense: 2500
    },
    {
        name: "槍兵",
        cost: 2,
        attack: 2500,
        defense: 2000
    },
    {
        name: "対空魔導師",
        cost: 3,
        attack: 2000,
        defense: 2000
    }
];

let canPlay = true;


/* --------------------
   初期手札
-------------------- */

hand.push(deck.shift());
hand.push(deck.shift());
hand.push(deck.shift());

render();


/* --------------------
   カードを出す
-------------------- */

function playCard(index) {

    if (!canPlay) {
        showMessage("⚠️ ターン終了済みです");
        return;
    }

    const card = hand[index];

    if (!card) {
        return;
    }


    if (cost < card.cost) {

        showMessage("❌ コストが足りない！");
        return;
    }


    if (frontCards.length >= 3) {

        showMessage("❌ 前線は3枚まで！");
        return;
    }


    cost -= card.cost;

    frontCards.push({
        ...card,
        ready: false
    });

    hand.splice(index, 1);

    showMessage(
        "⚔️ " + card.name + "が前線に出撃！"
    );

    render();
}


/* --------------------
   ターン終了
-------------------- */

function endTurn() {

    if (!canPlay) {
        return;
    }


    canPlay = false;

    showMessage("ターン終了。次のターンへ……");

    document.getElementById("endButton").disabled = true;


    setTimeout(nextTurn, 700);
}


/* --------------------
   次のターン
-------------------- */

function nextTurn() {

    turn++;

    /*
       テスト版では毎ターン
       コスト3回復
    */

    cost += 3;


    /*
       配置済みカードを
       攻撃可能にする
    */

    frontCards.forEach(card => {
        card.ready = true;
    });


    /*
       1枚ドロー
    */

    if (deck.length > 0) {

        hand.push(deck.shift());

        showMessage("📥 カードを1枚ドロー！");
    }


    canPlay = true;

    document.getElementById("endButton").disabled = false;

    render();
}


/* --------------------
   画面更新
-------------------- */

function render() {

    document.getElementById("turn").textContent = turn;

    document.getElementById("cost").textContent = cost;


    /*
       前線
    */

    const front = document.getElementById("front");

    front.innerHTML = "";


    for (let i = 0; i < 3; i++) {

        const slot = document.createElement("div");

        slot.className = "slot";


        if (frontCards[i]) {

            const card = frontCards[i];

            slot.innerHTML =
                "<strong>" +
                card.name +
                "</strong><br><br>" +
                "ATK " +
                card.attack +
                "<br>" +
                "DEF " +
                card.defense +
                "<br><br>" +
                (card.ready
                    ? "⚔️ 攻撃可能"
                    : "⏳ 待機");

        } else {

            slot.textContent = "空き";
        }


        front.appendChild(slot);
    }


    /*
       手札
    */

    const handElement = document.getElementById("hand");

    handElement.innerHTML = "";


    hand.forEach((card, index) => {

        const button = document.createElement("button");

        button.className = "card";

        button.innerHTML =
            "<div class='card-name'>" +
            card.name +
            "</div>" +

            "<div class='card-info'>" +
            "コスト：" +
            card.cost +
            "<br>" +
            "国力：0" +
            "<br>" +
            "ATK：" +
            card.attack +
            "<br>" +
            "DEF：" +
            card.defense +
            "</div>";


        button.onclick = function() {

            playCard(index);

        };


        handElement.appendChild(button);

    });

}


/* --------------------
   メッセージ
-------------------- */

function showMessage(text) {

    document.getElementById("message").textContent = text;

}

</script>

</body>
</html>
