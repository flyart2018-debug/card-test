<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>カードテスト</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    background: #eeeeee;
    color: #222;
}

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 24px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.status {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin-bottom: 12px;
}

.box {
    background: white;
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    box-shadow: 0 2px 5px #0002;
}

.number {
    font-size: 19px;
    font-weight: bold;
    margin-top: 4px;
}

.section {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 5px #0002;
}

.title {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}

.slots {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap: 8px;
}

.slot {
    min-height: 90px;
    border: 2px dashed #aaa;
    border-radius: 10px;
    padding: 8px;
    text-align: center;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.defense {
    border-color: #777;
    background: #fafafa;
}

.face-down {
    background: #333;
    color: white;
    border: 2px solid #111;
    font-size: 30px;
    font-weight: bold;
}

.revealed {
    background: #fff;
    color: #222;
    border: 2px solid #b33;
}

.enemy {
    border-color: #c44;
}

.player {
    border-color: #488;
}

.card {
    width: 100%;
    min-height: 100px;
    background: #f8f8f8;
    border: 2px solid #aaa;
    border-radius: 10px;
    padding: 10px;
    text-align: left;
}

button.card {
    cursor: pointer;
}

button.card:active {
    transform: scale(0.97);
}

.card-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

.card-info {
    font-size: 13px;
    line-height: 1.5;
}

.hand {
    display: grid;
    grid-template-columns:
        repeat(2, 1fr);
    gap: 8px;
}

.action {
    width: 100%;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    padding: 8px;
    font-weight: bold;
}

.message {
    text-align: center;
    font-weight: bold;
    margin-top: 10px;
    line-height: 1.6;
}

.result {
    display: none;
    text-align: center;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 12px;
    background: white;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 2px 5px #0002;
}

.end-button,
.reset-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    color: white;
    padding: 15px;
    font-size: 17px;
    font-weight: bold;
}

.end-button {
    background: #222;
}

.end-button:disabled {
    background: #999;
}

.reset-button {
    background: #777;
    margin-top: 8px;
}

</style>
</head>


<body>

<header>
カードテスト
</header>


<main>


<!-- 勝敗 -->

<div
    class="result"

</div>


<!-- ステータス -->

    <div class="box">

    </div>

</div>


<!-- CPU防衛軍 -->

    </div>

    </div>

</div>


<!-- CPU前線 -->

<div class="section">

    <div class="title">
        CPU 前線
    </div>

    </div>

</div>


<!-- 自分防衛軍 -->

<div class="section">

    </div>

    <div

    </div>

</div>


<!-- 自分前線 -->

<div class="section">

    <div class="title">
        あなたの前線
    </div>

    <div

    </div>

</div>


<!-- 手札 -->

<div class="section">

    <div class="title">

    </div>

    <div

    </div>

    <div

        戦闘テスト
    </div>

</div>


<button

    onclick="endTurn()">

    ターン終了

</button>


<button
    class="reset-button"
    onclick="resetGame()">

    ゲームリセット

</button>


</main>

/* ==================================================
   ランダムに1枚取り出す
================================================== */

function drawRandomCard(deck) {

    if (deck.length === 0) {
        return null;
    }

    const index =
        Math.floor(
            Math.random() * deck.length
        );

    return deck.splice(index, 1)[0];

}


/* ==================================================
   防衛軍5枚をランダム選出
================================================== */

function createStartingDefense(
    originalDeck
) {

    const defense = [];

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const card =
            drawRandomCard(
                originalDeck
            );

        if (card) {
            defense.push({

                /* 
                   防衛軍として
                   裏向きになっている状態
                */

                card: card,

                revealed: false

            });
        }

    }

    return defense;

}


/* ==================================================
   デッキシャッフル
================================================== */

function shuffleDeck(deck) {

    for (
        let i = deck.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            deck[i],
            deck[j]
        ] =
        [
            deck[j],
            deck[i]
        ];

    }

}


/* ==================================================
   ゲーム開始
================================================== */

function resetGame() {

    turn = 1;

    cost = 3;

    playerPower = 3;
    cpuPower = 3;

    playerBase = 3;
    cpuBase = 3;


    /*
       オリジナルデッキを作成
    */

    playerOriginalDeck =
        createOriginalDeck();

    cpuOriginalDeck =
        createOriginalDeck();


    /*
       ★ オリジナルデッキから
          ランダム5枚を防衛軍へ
    */

    playerDefense =
        createStartingDefense(
            playerOriginalDeck
        );

    enemyDefense =
        createStartingDefense(
            cpuOriginalDeck
        );


    /*
       残りが構築デッキ
    */

    playerDeck =
        playerOriginalDeck;

    cpuDeck =
        cpuOriginalDeck;


    /*
       構築デッキをシャッフル
    */

    shuffleDeck(playerDeck);

    shuffleDeck(cpuDeck);


    playerFront = [];

    enemyFront = [];


    /*
       テスト用手札
    */

    hand = [

        {
            name: "歩兵",
            type: "unit",
            cost: 0,
            attack: 2000,
            defense: 2500
        },

        {
            name: "槍兵",
            type: "unit",
            cost: 0,
            attack: 2500,
            defense: 2000
        },

        {
            name: "弓兵",
            type: "unit",
            cost: 0,
            attack: 1800,
            defense: 1800
        }

    ];


    /*
       テスト用CPU前線
    */

    enemyFront.push({

        name: "歩兵",
        type: "unit",
        cost: 0,
        attack: 2000,
        defense: 2500,
        ready: true

    });


    gameOver = false;

    canPlay = true;


    document.getElementById(
        "result"
    ).style.display = "none";


    render();


    showMessage(
        "🂠 防衛軍5枚を裏向きで配置"
    );

}


/* ==================================================
   カードを出す
================================================== */

function playCard(index) {

    if (gameOver) return;


    if (!canPlay) {

        showMessage(
            "⚠️ ターン終了済み"
        );

        return;

    }


    const card =
        hand[index];


    if (!card) return;


    if (
        cost < card.cost
    ) {

        showMessage(
            "❌ コスト不足"
        );

        return;

    }


    if (
        playerFront.length >= 3
    ) {

        showMessage(
            "❌ 前線は3枚まで"
        );

        return;

    }


    cost -= card.cost;


    playerFront.push({

        ...card,

        ready: false

    });


    hand.splice(
        index,
        1
    );


    showMessage(
        "⚔️ " +
        card.name +
        "が出撃！"
    );


    render();

}


/* ==================================================
   攻撃
================================================== */

function attack(index) {

    if (gameOver) return;


    const attacker =
        playerFront[index];


    if (!attacker) return;


    if (!attacker.ready) {

        showMessage(
            "⏳ 次のターンから攻撃できます"
        );

        return;

    }


    /*
       敵前線が存在
    */

    if (
        enemyFront.length > 0
    ) {

        const defender =
            enemyFront[0];


        showMessage(
            "⚔️ " +
            attacker.name +
            " vs " +
            defender.name
        );


        setTimeout(
            function() {

                battle(index);

            },
            400
        );


        return;

    }


    /*
       前線0
       ↓
       防衛軍
    */

    attackDefense(index);

}


/* ==================================================
   防衛軍への攻撃
================================================== */

function attackDefense(index) {

    const attacker =
        playerFront[index];


    if (!attacker) return;


    /*
       防衛軍が残っていない
    */

    if (
        enemyDefense.length === 0
    ) {

        damageBase("cpu");

        attacker.ready = false;

        render();

        return;

    }


    /*
       ★ 国力と同じ枚数
    */

    const destroyCount =
        Math.min(
            playerPower,
            enemyDefense.length
        );


    /*
       今回の攻撃で破壊される
       防衛軍カードを順番に処理
    */

    revealAndDestroyDefense(
        destroyCount,
        attacker
    );

}


/* ==================================================
   防衛軍を公開→破壊
================================================== */

function revealAndDestroyDefense(
    count,
    attacker
) {

    let destroyed = 0;


    function processOne() {

        if (
            destroyed >= count ||
            enemyDefense.length === 0
        ) {

            /*
               攻撃済みにする
            */

            attacker.ready = false;


            /*
               防衛軍0
            */

            if (
                enemyDefense.length === 0
            ) {

                showMessage(
                    "🛡️ 防衛軍をすべて破壊！"
                );

            }
            else {

                showMessage(

                    "🛡️ 防衛軍を " +
                    destroyed +
                    " 枚破壊！" +

                    "<br>" +

                    "残り：" +
                    enemyDefense.length

                );

            }


            render();

            return;

        }


        /*
           一番上の防衛軍を対象
        */

        const target =
            enemyDefense[
                enemyDefense.length - 1
            ];


        /*
           ★ 表向きにする
        */

        target.revealed = true;


        showMessage(

            "🃏 防衛軍を公開！" +

            "<br><strong>" +

            target.card.name +

            "</strong>" +

            "<br>" +

            "ATK " +
            target.card.attack +

            " / DEF " +
            target.card.defense

        );


        render();


        /*
           公開してから破壊
        */

        setTimeout(
            function() {

                /*
                   構築デッキへ戻す
                */

                const destroyedCard =
                    enemyDefense.pop();


                cpuDeck.push(
                    destroyedCard.card
                );


                /*
                   ★ 戻した後シャッフル
                */

                shuffleDeck(
                    cpuDeck
                );


                destroyed++;


                showMessage(

                    "💥 " +
                    destroyedCard.card.name +
                    "を破壊！" +

                    "<br>" +

                    "構築デッキへ戻してシャッフル"

                );


                render();


                /*
                   次の防衛軍へ
                */

                setTimeout(
                    processOne,
                    600
                );

            },
            900
        );

    }


    processOne();

}


/* ==================================================
   前線戦闘
================================================== */

function battle(attackerIndex) {

    const attacker =
        playerFront[
            attackerIndex
        ];

    const defender =
        enemyFront[0];


    if (
        !attacker ||
        !defender
    ) {

        return;

    }


    if (
        attacker.attack >
        defender.defense
    ) {

        enemyFront.shift();


        showMessage(

            "💥 " +
            attacker.name +
            "が" +
            defender.name +
            "を破壊！"

        );

    }


    else if (
        attacker.attack <
        defender.defense
    ) {

        playerFront.splice(
            attackerIndex,
            1
        );


        showMessage(

            "💀 " +
            attacker.name +
            "が破壊された！"

        );

    }


    else {

        playerFront.splice(
            attackerIndex,
            1
        );


        enemyFront.shift();


        showMessage(
            "💥 両方のカードが同時破壊！"
        );

    }


    render();

}


/* ==================================================
   拠点ダメージ
================================================== */

function damageBase(target) {

    if (
        target === "cpu"
    ) {

        cpuBase--;


        showMessage(

            "🏰 CPU拠点を1つ破壊！" +

            "<br>" +

            "残り：" +
            cpuBase

        );


        if (
            cpuBase <= 0
        ) {

            endGame("win");

        }

    }


    if (
        target === "player"
    ) {

        playerBase--;


        showMessage(

            "🏰 あなたの拠点を1つ破壊！" +

            "<br>" +

            "残り：" +
            playerBase

        );


        if (
            playerBase <= 0
        ) {

            endGame("lose");

        }

    }

}


/* ==================================================
   ターン終了
================================================== */

function endTurn() {

    if (gameOver) return;


    canPlay = false;


    showMessage(
        "ターン終了……"
    );


    setTimeout(
        nextTurn,
        600
    );

}


/* ==================================================
   次ターン
================================================== */

function nextTurn() {

    if (gameOver) return;


    turn++;


    cost += 3;


    /*
       前線を攻撃可能に
    */

    playerFront.forEach(
        function(card) {

            card.ready = true;

        }
    );


    /*
       構築デッキから1枚
    */

    if (
        playerDeck.length > 0
    ) {

        hand.push(
            playerDeck.shift()
        );

    }


    /*
       防衛軍には触らない
    */

    canPlay = true;


    showMessage(

        "📥 ターン " +
        turn +
        " 開始！"

    );


    render();

}


/* ==================================================
   勝敗
================================================== */

function endGame(result) {

    gameOver = true;

    canPlay = false;


    const resultElement =
        document.getElementById(
            "result"
        );


    resultElement.style.display =
        "block";


    if (
        result === "win"
    ) {

        resultElement.textContent =
            "🎉 勝利！";


        showMessage(
            "CPUの拠点をすべて破壊しました！"
        );

    }


    if (
        result === "lose"
    ) {

        resultElement.textContent =
            "💀 敗北";


        showMessage(
            "あなたの拠点がすべて破壊されました。"
        );

    }


    document.getElementById(
        "endButton"
    ).disabled = true;

}


/* ==================================================
   防衛軍表示
================================================== */

function renderDefense(
    elementId,
    defense
) {

    const container =
        document.getElementById(
            elementId
        );


    container.innerHTML = "";


    defense.forEach(
        function(defenseCard) {

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "slot defense";


            /*
               ★ 裏向き
            */

            if (
                !defenseCard.revealed
            ) {

                slot.classList.add(
                    "face-down"
                );


                slot.innerHTML =
                    "🂠";

            }


            /*
               公開状態
            */

            else {

                slot.classList.add(
                    "revealed"
                );


                slot.innerHTML =

                    "<strong>" +

                    defenseCard.card.name +

                    "</strong><br>" +

                    "ATK " +

                    defenseCard.card.attack +

                    "<br>" +

                    "DEF " +

                    defenseCard.card.defense;

            }


            container.appendChild(
                slot
            );

        }
    );


    if (
        defense.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "slot defense";


        empty.innerHTML =
            "防衛軍なし<br>" +
            "次の攻撃で拠点へ";


        container.appendChild(
            empty
        );

    }

}


/* ==================================================
   画面更新
================================================== */

function render() {

    document.getElementById(
        "turn"
    ).textContent =
        turn;


    document.getElementById(
        "playerPower"
    ).textContent =
        playerPower;


    document.getElementById(
        "enemyDefenseCount"
    ).textContent =
        enemyDefense.length;


    document.getElementById(
        "cpuBase"
    ).textContent =
        cpuBase;


    document.getElementById(
        "cost"
    ).textContent =
        cost;


    /*
       防衛軍
    */

    renderDefense(
        "enemyDefense",
        enemyDefense
    );


    renderDefense(
        "playerDefense",
        playerDefense
    );


    /*
       CPU前線
    */

    const enemy =
        document.getElementById(
            "enemyFront"
        );


    enemy.innerHTML = "";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot enemy";


        if (
            enemyFront[i]
        ) {

            const card =
                enemyFront[i];


            slot.innerHTML =

                "<strong>" +
                card.name +
                "</strong><br><br>" +

                "ATK " +
                card.attack +

                "<br>" +

                "DEF " +
                card.defense;

        }

        else {

            slot.textContent =
                "空き";

        }


        enemy.appendChild(
            slot
        );

    }


    /*
       自分前線
    */

    const front =
        document.getElementById(
            "front"
        );


    front.innerHTML = "";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const slot =
            document.createElement(
                "div"
            );


        slot.className =
            "slot player";


        if (
            playerFront[i]
        ) {

            const card =
                playerFront[i];


            slot.innerHTML =

                "<strong>" +
                card.name +
                "</strong><br><br>" +

                "ATK " +
                card.attack +

                "<br>" +

                "DEF " +
                card.defense;


            if (
                card.ready &&
                !gameOver
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "action";


                button.textContent =
                    "⚔️ 攻撃";


                button.onclick =
                    function() {

                        attack(i);

                    };


                slot.appendChild(
                    button
                );

            }


            else if (
                !card.ready
            ) {

                const text =
                    document.createElement(
                        "div"
                    );


                text.textContent =
                    "⏳ 待機";


                slot.appendChild(
                    text
                );

            }

        }

        else {

            slot.textContent =
                "空き";

        }


        front.appendChild(
            slot
        );

    }


    /*
       手札
    */

    const handElement =
        document.getElementById(
            "hand"
        );


    handElement.innerHTML = "";


    hand.forEach(
        function(card, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "card";


            button.innerHTML =

                "<div class='card-name'>" +

                card.name +

                "</div>" +

                "<div class='card-info'>" +

                "コスト：" +
                card.cost +

                "<br>" +

                "ATK：" +
                card.attack +

                "<br>" +

                "DEF：" +
                card.defense +

                "</div>";


            button.onclick =
                function() {

                    playCard(index);

                };


            handElement.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "endButton"
    ).disabled =
        gameOver;

}


/* ==================================================
   メッセージ
================================================== */

function showMessage(text) {

    document.getElementById(
        "message"
    ).innerHTML =
        text;

}


/* ==================================================
   起動
================================================== */

resetGame();

</script>

</body>
</html>
